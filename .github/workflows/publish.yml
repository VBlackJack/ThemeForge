name: Publish ThemeForge packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Publish ThemeForge packages
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Shared verification gates
        shell: pwsh
        run: ./tools/ci-verify.ps1 -OutputDirectory artifacts

      - name: Verify release version
        shell: pwsh
        run: |
          [xml]$properties = Get-Content Directory.Build.props
          [string]$version = $properties.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ.' }

      - name: Upload verified packages and evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/performance/*.json
            artifacts/document/*.json
          if-no-files-found: error

      - name: Add GitHub Packages source
        run: dotnet nuget add source https://nuget.pkg.github.com/VBlackJack/index.json --name github --username VBlackJack --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - name: Push packages to GitHub Packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/push-packages.ps1 -PackageDirectory artifacts/packages -Source github -ApiKey $env:NUGET_API_KEY

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: VBlackJack

      - name: Push packages to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: ./tools/push-packages.ps1 -PackageDirectory artifacts/packages -Source https://api.nuget.org/v3/index.json -ApiKey $env:NUGET_API_KEY
