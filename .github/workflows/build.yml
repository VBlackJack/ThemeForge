name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Shared verification gates
        shell: pwsh
        run: ./tools/ci-verify.ps1 -OutputDirectory artifacts

      - name: Capture visual and accessibility matrix
        shell: pwsh
        run: dotnet tests/ThemeForge.Quality/bin/Release/net10.0-windows/ThemeForge.Quality.dll visual tools/quality-settings.json artifacts/visual

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            artifacts/visual
            artifacts/performance
            artifacts/document
            artifacts/consumer-*/*.json
            artifacts/consumer-*/failure.txt
